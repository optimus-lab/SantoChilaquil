    <script>

        /* ========================================================
           CONFIGURACIÓN PRINCIPAL
        ========================================================= */

        // ========================================================
        // CAMBIA AQUÍ EL NOMBRE DE TU RESTAURANTE
        // ========================================================

        const RESTAURANT_NAME = "Santo Chilaquil";


        // ========================================================
        // CAMBIA AQUÍ TU NÚMERO DE WHATSAPP
        //
        // IMPORTANTE:
        // Escribe el número con código de país.
        //
        // México = 52
        //
        // Ejemplo:
        // const WHATSAPP_NUMBER = "525512345678";
        //
        // NO pongas +, espacios ni guiones.
        // ========================================================

        const WHATSAPP_NUMBER = "529981199650";


        /* ========================================================
           CATÁLOGO DE PRODUCTOS

           Solo necesitas modificar este array para cambiar
           nombres, precios, descripciones y categorías.
        ========================================================= */

        const products = [

            {
                id: 1,
                name: "Chilaquiles Rojos de Pollo",
                description: "Pollo, Salsa roja medianamente picosa,cebolla, cilantro.",
                price: 70,
                category: "Plato Fuerte",
                emoji: ""
            },

            {
                id: 2,
                name: "Chilaquiles Rojos Cerdo",
                description: "Proteina Cerdo, Salsa roja medianamente picosa,cebolla, cilantro",
                price: 180,
                category: "Platos Fuertes",
                emoji: ""
            },
            
            {
                id: 3,
                name: "Chilaquiles Verdes con pollo",
                description: "Proteina Pollo, Salsa Verde medianamente picosa,cebolla, cilantro",
                price: 45,
                category: "Plato Fuerte",
                emoji: ""
            },

            {
                id: 4,
                name: "Chilaquiles Verdes con Cerdo",
                description: "Proteina Cerdo, Salsa Verde medianamente picosa,cebolla, cilantro",
                price: 95,
                category: "Plato Fuerte",
                emoji: ""
            }

        ];


        /* ========================================================
           ESTADO LOCAL
        ========================================================= */

        let cart = [];


        /* ========================================================
           FORMATEAR MONEDA
        ========================================================= */

        function formatPrice(price) {

            return new Intl.NumberFormat("es-MX", {
                style: "currency",
                currency: "MXN"
            }).format(price);

        }


        /* ========================================================
           OBTENER CATEGORÍAS
        ========================================================= */

        function getCategories() {

            return [...new Set(products.map(product => product.category))];

        }


        /* ========================================================
           RENDERIZAR CATEGORÍAS
        ========================================================= */

        function renderCategories() {

            const categoryMenu =
                document.getElementById("categoryMenu");

            const categories = getCategories();

            categoryMenu.innerHTML = categories.map((category, index) => {

                return `
                    <button
                        onclick="scrollToCategory('${category}')"
                        class="
                            whitespace-nowrap
                            px-5
                            py-2
                            rounded-full
                            text-sm
                            font-semibold
                            transition
                            ${index === 0
                                ? "bg-restaurant-dark text-white"
                                : "bg-stone-100 text-stone-700 hover:bg-stone-200"}
                        ">

                        ${category}

                    </button>
                `;

            }).join("");

        }


        /* ========================================================
           RENDERIZAR PRODUCTOS
        ========================================================= */

        function renderProducts() {

            const container =
                document.getElementById("productsContainer");

            const categories = getCategories();

            container.innerHTML = categories.map(category => {

                const categoryProducts =
                    products.filter(
                        product => product.category === category
                    );

                return `

                    <section id="category-${category}">

                        <div class="flex items-center gap-3 mb-5">

                            <div class="w-1 h-7 bg-restaurant-gold rounded-full"></div>

                            <h2 class="text-2xl sm:text-3xl font-bold">
                                ${category}
                            </h2>

                        </div>


                        <div class="grid sm:grid-cols-2 gap-4">

                            ${categoryProducts.map(product => `

                                <article
                                    class="
                                        bg-white
                                        rounded-2xl
                                        p-5
                                        shadow-sm
                                        border
                                        border-stone-100
                                        hover:shadow-lg
                                        transition
                                        flex
                                        flex-col
                                        justify-between
                                    ">

                                    <div>

                                        <div class="flex gap-4">

                                            <div
                                                class="
                                                    w-16
                                                    h-16
                                                    rounded-2xl
                                                    bg-restaurant-cream
                                                    flex
                                                    items-center
                                                    justify-center
                                                    text-3xl
                                                    shrink-0
                                                ">

                                                ${product.emoji}

                                            </div>

                                            <div>

                                                <h3 class="font-bold text-lg">
                                                    ${product.name}
                                                </h3>

                                                <p class="text-stone-500 text-sm mt-1">
                                                    ${product.description}
                                                </p>

                                            </div>

                                        </div>

                                    </div>


                                    <div
                                        class="
                                            flex
                                            items-center
                                            justify-between
                                            gap-3
                                            mt-6
                                        ">

                                        <span
                                            class="
                                                text-xl
                                                font-bold
                                                text-restaurant-red
                                            ">

                                            ${formatPrice(product.price)}

                                        </span>


                                        <button
                                            onclick="addToCart(${product.id})"
                                            class="
                                                bg-restaurant-dark
                                                text-white
                                                px-4
                                                py-3
                                                rounded-xl
                                                text-sm
                                                font-semibold
                                                hover:bg-restaurant-brown
                                                transition
                                            ">

                                            + Agregar

                                        </button>

                                    </div>

                                </article>

                            `).join("")}

                        </div>

                    </section>

                `;

            }).join("");

        }


        /* ========================================================
           SCROLL A CATEGORÍA
        ========================================================= */

        function scrollToCategory(category) {

            const element =
                document.getElementById(`category-${category}`);

            if (element) {

                element.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }

        }


        /* ========================================================
           AGREGAR AL CARRITO
        ========================================================= */

        function addToCart(productId) {

            const product =
                products.find(product => product.id === productId);

            if (!product) return;

            const existingProduct =
                cart.find(item => item.id === productId);

            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }

            updateCart();

            // Animación del contador

            const cartCount =
                document.getElementById("cartCount");

            cartCount.classList.remove("cart-bounce");

            void cartCount.offsetWidth;

            cartCount.classList.add("cart-bounce");

        }


        /* ========================================================
           CAMBIAR CANTIDAD
        ========================================================= */

        function changeQuantity(productId, change) {

            const item =
                cart.find(product => product.id === productId);

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {

                cart =
                    cart.filter(product => product.id !== productId);

            }

            updateCart();

        }


        /* ========================================================
           ELIMINAR PRODUCTO
        ========================================================= */

        function removeFromCart(productId) {

            cart =
                cart.filter(product => product.id !== productId);

            updateCart();

        }


        /* ========================================================
           TOTAL DE PRODUCTOS
        ========================================================= */

        function getCartItemsCount() {

            return cart.reduce(
                (total, item) => total + item.quantity,
                0
            );

        }


        /* ========================================================
           TOTAL DEL CARRITO
        ========================================================= */

        function getCartTotal() {

            return cart.reduce(
                (total, item) =>
                    total + (item.price * item.quantity),
                0
            );

        }


        /* ========================================================
           ACTUALIZAR CARRITO
        ========================================================= */

        function updateCart() {

            const cartItems =
                document.getElementById("cartItems");

            const total =
                getCartTotal();

            const itemCount =
                getCartItemsCount();


            // Contador

            document.getElementById("cartCount").textContent =
                itemCount;


            // Totales

            document.getElementById("cartTotal").textContent =
                formatPrice(total);

            document.getElementById("floatingCartTotal").textContent =
                formatPrice(total);

            document.getElementById("checkoutTotal").textContent =
                formatPrice(total);


            // Carrito vacío

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="text-center py-16">

                        <div class="text-5xl mb-4">
                            🛒
                        </div>

                        <h3 class="font-bold text-xl mb-2">
                            Tu carrito está vacío
                        </h3>

                        <p class="text-stone-500">
                            Agrega algunos productos para comenzar tu pedido.
                        </p>

                    </div>

                `;

                document.getElementById("checkoutButton").disabled = true;

                return;

            }


            document.getElementById("checkoutButton").disabled = false;


            // Renderizar productos

            cartItems.innerHTML = cart.map(item => {

                const subtotal =
                    item.price * item.quantity;

                return `

                    <div class="border-b pb-4">

                        <div class="flex justify-between gap-3">

                            <div class="flex-1">

                                <h4 class="font-bold">
                                    ${item.name}
                                </h4>

                                <p class="text-sm text-stone-500 mt-1">
                                    ${formatPrice(item.price)} c/u
                                </p>

                            </div>

                            <button
                                onclick="removeFromCart(${item.id})"
                                class="text-stone-400 hover:text-red-600">

                                ✕

                            </button>

                        </div>


                        <div
                            class="
                                flex
                                items-center
                                justify-between
                                mt-3
                            ">

                            <div
                                class="
                                    flex
                                    items-center
                                    border
                                    rounded-lg
                                    overflow-hidden
                                ">

                                <button
                                    onclick="changeQuantity(${item.id}, -1)"
                                    class="px-3 py-2 hover:bg-stone-100">

                                    −

                                </button>

                                <span
                                    class="px-4 font-semibold">

                                    ${item.quantity}

                                </span>

                                <button
                                    onclick="changeQuantity(${item.id}, 1)"
                                    class="px-3 py-2 hover:bg-stone-100">

                                    +

                                </button>

                            </div>


                            <span class="font-bold">

                                ${formatPrice(subtotal)}

                            </span>

                        </div>

                    </div>

                `;

            }).join("");

        }


        /* ========================================================
           ABRIR CARRITO
        ========================================================= */

        function openCart() {

            const panel =
                document.getElementById("cartPanel");

            const overlay =
                document.getElementById("cartOverlay");

            panel.classList.remove("cart-closed");

            panel.classList.add("cart-open");

            overlay.classList.remove("hidden");

            setTimeout(() => {

                overlay.classList.remove("opacity-0");

            }, 10);

            document.body.style.overflow = "hidden";

        }


        /* ========================================================
           CERRAR CARRITO
        ========================================================= */

        function closeCart() {

            const panel =
                document.getElementById("cartPanel");

            const overlay =
                document.getElementById("cartOverlay");

            panel.classList.remove("cart-open");

            panel.classList.add("cart-closed");

            overlay.classList.add("opacity-0");

            setTimeout(() => {

                overlay.classList.add("hidden");

            }, 300);

            document.body.style.overflow = "";

        }


        /* ========================================================
           MOSTRAR CHECKOUT
        ========================================================= */

        function showCheckout() {

            if (cart.length === 0) {

                alert("Agrega al menos un producto al carrito.");

                return;

            }

            document.getElementById("checkoutModal")
                .classList.remove("hidden");

            document.getElementById("checkoutTotal").textContent =
                formatPrice(getCartTotal());

        }


        /* ========================================================
           CERRAR CHECKOUT
        ========================================================= */

        function closeCheckout() {

            document.getElementById("checkoutModal")
                .classList.add("hidden");

        }


        /* ========================================================
           MOSTRAR / OCULTAR DIRECCIÓN
        ========================================================= */

        function toggleAddress() {

            const deliveryType =
                document.querySelector(
                    'input[name="deliveryType"]:checked'
                )?.value;

            const addressContainer =
                document.getElementById("addressContainer");

            const address =
                document.getElementById("customerAddress");


            if (deliveryType === "Domicilio") {

                addressContainer.classList.remove("hidden");

                address.required = true;

            } else {

                addressContainer.classList.add("hidden");

                address.required = false;

                address.value = "";

            }

        }


        /* ========================================================
           CONFIRMAR PEDIDO
        ========================================================= */

        function confirmOrder(event) {

            event.preventDefault();


            // Validar carrito

            if (cart.length === 0) {

                alert("Tu carrito está vacío.");

                return;

            }


            // Datos del cliente

            const customerName =
                document.getElementById("customerName")
                    .value
                    .trim();


            const deliveryType =
                document.querySelector(
                    'input[name="deliveryType"]:checked'
                )?.value;


            const address =
                document.getElementById("customerAddress")
                    .value
                    .trim();


            // Validación nombre

            if (!customerName) {

                alert("Por favor ingresa tu nombre.");

                return;

            }


            // Validación entrega

            if (!deliveryType) {

                alert("Selecciona el tipo de entrega.");

                return;

            }


            // Validación dirección

            if (
                deliveryType === "Domicilio" &&
                !address
            ) {

                alert("Por favor ingresa tu dirección.");

                return;

            }


            /* ====================================================
               CONSTRUIR MENSAJE WHATSAPP
            ==================================================== */

            let message = "";

            message += `*Nuevo Pedido - ${RESTAURANT_NAME}*`;
            message += `%0A---------------------------------`;

            message += `%0A*Cliente:* ${customerName}`;

            message += `%0A*Entrega:* ${deliveryType}`;

            if (deliveryType === "Domicilio") {

                message += `%0A*Dirección:* ${address}`;

            }

            message += `%0A---------------------------------`;

            message += `%0A*Detalle del Pedido:*`;


            // Productos

            cart.forEach(item => {

                const subtotal =
                    item.price * item.quantity;

                message +=
                    `%0A- ${item.quantity}x ${item.name} (${formatPrice(subtotal)})`;

            });


            // Total

            message += `%0A---------------------------------`;

            message +=
                `%0A*Total a Pagar:* ${formatPrice(getCartTotal())}`;


            /* ====================================================
               CODIFICAR MENSAJE
            ==================================================== */

            const encodedMessage =
                encodeURIComponent(
                    decodeURIComponent(message)
                );


            /* ====================================================
               CREAR URL DE WHATSAPP
            ==================================================== */

            const whatsappUrl =
                `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;


            /* ====================================================
               ABRIR WHATSAPP
            ==================================================== */

            window.open(
                whatsappUrl,
                "_blank"
            );

        }


        /* ========================================================
           INICIALIZAR SISTEMA
        ========================================================= */

        function init() {

            // Mostrar nombre del restaurante

            document.getElementById(
                "restaurantNameHeader"
            ).textContent = RESTAURANT_NAME;


            // Renderizar catálogo

            renderCategories();

            renderProducts();

            updateCart();

        }


        // Ejecutar sistema

        init();

    </script>

</body>
</html>
